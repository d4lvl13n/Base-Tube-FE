name: web-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      # The gate that was missing when contract bugs shipped silently:
      # tsc must stay green. (typescript 5.x — see Sprint 3.1 in
      # docs/HANDOFF_CONTRACT_FIXES.md for the history.)
      - name: Typecheck
        run: npm run typecheck

      # Excluded suites: App.test/useVideoProcessing/useVideoProgress have
      # pre-existing failures; usePublicThumbnailGenerator's polling test is
      # timing-flaky on CI runners (passes locally). Fix them and remove the
      # ignore patterns.
      - name: Unit tests
        run: npx react-scripts test --watchAll=false --runInBand --forceExit --testPathIgnorePatterns "App.test.tsx" "useVideoProcessing.test.ts" "useVideoProgress.test.ts" "usePublicThumbnailGenerator.test.ts"
        env:
          CI: true

      - name: Build
        run: npx react-scripts build
        env:
          CI: false # CRA treats eslint warnings as errors when CI=true; warnings are tracked separately
          # Deterministic public test configuration, not live service credentials.
          REACT_APP_CLERK_PUBLISHABLE_KEY: pk_test_cGVyZi5jbGVyay5hY2NvdW50cy5kZXYk
          REACT_APP_ONCHAINKIT_API_KEY: performance-fixture
          REACT_APP_WALLETCONNECT_PROJECT_ID: '00000000000000000000000000000000'
          REACT_APP_API_URL: http://127.0.0.1:4173

      - name: Performance budget tests and production assets
        run: npm run perf:test && npm run perf:budget

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Public content under slow network and pending authentication
        run: npm run perf:smoke

      - name: Performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-performance
          path: output/performance/
