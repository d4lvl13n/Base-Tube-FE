# Include ONLY inside the static frontend asset location in the port-3001
# basetube-frontend virtual host. Do not include for authenticated API responses.
# Live layout: /etc/nginx/sites-enabled/basetube-frontend, location /static.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types application/javascript text/css application/json image/svg+xml;
