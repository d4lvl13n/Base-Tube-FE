<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- GA4: property 441686664 (base-early-access), stream 8166603679.
         Initial page views and SPA history changes use enhanced measurement.
         Only the production app sends analytics; local development stays out. -->
    <script>
      if (window.location.hostname === 'beta.base.tube') {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){window.dataLayer.push(arguments);};
        window.gtag('js', new Date());
        window.gtag('config', 'G-DQELH44BE4');
        var gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-DQELH44BE4';
        document.head.appendChild(gaScript);
      }
    </script>

    <!-- Favicons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/favicon-96x96.png">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    
    <!-- Primary Meta Tags -->
    <title>Base.Tube - Web3 Video Platform</title>
    <meta name="title" content="Base.Tube - Web3 Video Platform">
    <meta name="description" content="Decentralized content sharing with true ownership on Base">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://beta.base.tube/">
    <meta property="og:title" content="Base.Tube - Web3 Video Platform">
    <meta property="og:description" content="Decentralized content sharing with true ownership on Base">
    <meta property="og:image" content="%PUBLIC_URL%/og-card.webp">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://base.tube/">
    <meta property="twitter:title" content="Base.Tube - Web3 Video Platform">
    <meta property="twitter:description" content="Decentralized content sharing with true ownership on Base">
    <meta property="twitter:image" content="%PUBLIC_URL%/og-card.png">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- DM Serif Display: the headline face of base.tube, used by the channel audit report. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    
    <!-- Add these meta tags for Cloudflare compatibility -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="credentialless">
    <!-- With JavaScript, every page shows its own legal links: hide the static footer below before
         the first paint, so it never flashes at the top of the screen or sits under every page.
         It stays in this HTML for crawlers that read it without running JavaScript. -->
    <script>document.documentElement.classList.add('js');</script>
    <style>html.js #static-legal-links { display: none; }</style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div role="status" aria-live="polite" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#09090b;color:#e4e4e7;text-align:center;font:16px/1.6 system-ui,sans-serif">
        <p style="color:#fa7517;font-weight:700">Base.Tube</p>
        <p>Loading your workspace…</p>
        <p style="max-width:340px;color:#a1a1aa;font-size:14px">On a slow connection this can take a moment. If it stays here, <a href="" onclick="window.location.reload();return false" style="color:#fb923c">reload the page</a>.</p>
        <nav aria-label="Service information" style="margin-top:16px;font-size:13px"><a href="/privacy" style="color:#a1a1aa;margin:0 8px">Privacy</a><a href="/terms" style="color:#a1a1aa;margin:0 8px">Terms</a></nav>
      </div>
    </div>
    <!-- Static, always-crawlable legal links, OUTSIDE #root so React never
         removes them. Guarantees Google/YouTube OAuth verification finds the
         Privacy Policy link on the home page even without full SPA rendering.
         Hidden when JavaScript runs (see the head): the home page renders its own link. -->
    <footer id="static-legal-links" style="text-align:center;padding:16px;font:12px/1.5 system-ui,sans-serif;color:#6b7280;background:#000">
      <a href="/privacy" style="color:#9ca3af;margin:0 8px">Privacy Policy</a>
      <a href="/terms" style="color:#9ca3af;margin:0 8px">Terms of Service</a>
      <a href="/refund" style="color:#9ca3af;margin:0 8px">Refunds</a>
    </footer>
  </body>
</html>
